spring:
  application:
    name: pulseguard-test

  datasource:
    url: jdbc:h2:mem:pulseguard_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

logging:
  level:
    root: WARN
    com.pulseguard: DEBUG

pulseguard:
  scheduler:
    enabled: false
    polling-interval-ms: 10000
    initial-delay-ms: 10000
    max-concurrent-checks: 5
    queue-capacity: 20
    termination-timeout-seconds: 5

