server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: pulseguard

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pulseguard}
    username: ${DB_USER:pulseguard_user}
    password: ${DB_PASSWORD:pulseguard_secret_change_in_production}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-postgresql
    baseline-on-migrate: true
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.pulseguard: DEBUG
    org.hibernate.SQL: WARN

pulseguard:
  scheduler:
    enabled: ${PULSEGUARD_SCHEDULER_ENABLED:true}
    polling-interval-ms: ${PULSEGUARD_SCHEDULER_POLL_INTERVAL_MS:5000}
    initial-delay-ms: ${PULSEGUARD_SCHEDULER_INITIAL_DELAY_MS:2000}
    max-concurrent-checks: ${PULSEGUARD_MAX_CONCURRENT_CHECKS:10}
    queue-capacity: ${PULSEGUARD_SCHEDULER_QUEUE_CAPACITY:100}
    termination-timeout-seconds: ${PULSEGUARD_SCHEDULER_TERMINATION_TIMEOUT_SECONDS:30}
  incident:
    consecutive-failures-threshold: ${PULSEGUARD_INCIDENT_FAILURES_THRESHOLD:3}
    consecutive-successes-threshold: ${PULSEGUARD_INCIDENT_SUCCESSES_THRESHOLD:1}
    initial-severity: ${PULSEGUARD_INCIDENT_INITIAL_SEVERITY:CRITICAL}
  notifications:
    dispatcher:
      enabled: ${PULSEGUARD_NOTIFICATIONS_DISPATCHER_ENABLED:true}
      poll-interval-ms: ${PULSEGUARD_NOTIFICATIONS_POLL_INTERVAL_MS:2000}
      initial-delay-ms: ${PULSEGUARD_NOTIFICATIONS_INITIAL_DELAY_MS:3000}
      batch-size: ${PULSEGUARD_NOTIFICATIONS_BATCH_SIZE:20}
      max-concurrent-deliveries: ${PULSEGUARD_NOTIFICATIONS_MAX_CONCURRENT:4}
      queue-capacity: ${PULSEGUARD_NOTIFICATIONS_QUEUE_CAPACITY:4}
      lease-duration: ${PULSEGUARD_NOTIFICATIONS_LEASE_DURATION:PT2M}
      termination-timeout-seconds: ${PULSEGUARD_NOTIFICATIONS_TERMINATION_TIMEOUT_SECONDS:30}
    retry:
      max-attempts: ${PULSEGUARD_NOTIFICATIONS_MAX_ATTEMPTS:6}
      initial-backoff: ${PULSEGUARD_NOTIFICATIONS_INITIAL_BACKOFF:PT5S}
      max-backoff: ${PULSEGUARD_NOTIFICATIONS_MAX_BACKOFF:PT10M}
      jitter: ${PULSEGUARD_NOTIFICATIONS_JITTER:0.2}
    http:
      connect-timeout: ${PULSEGUARD_NOTIFICATIONS_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${PULSEGUARD_NOTIFICATIONS_READ_TIMEOUT:PT5S}
      total-timeout: ${PULSEGUARD_NOTIFICATIONS_TOTAL_TIMEOUT:PT10S}
      max-payload-bytes: ${PULSEGUARD_NOTIFICATIONS_MAX_PAYLOAD_BYTES:16384}
    rate-limit:
      per-minute: ${PULSEGUARD_NOTIFICATIONS_RATE_LIMIT_PER_MINUTE:120}
    occurrence:
      notify-every: ${PULSEGUARD_NOTIFICATIONS_OCCURRENCE_NOTIFY_EVERY:10}
      min-interval: ${PULSEGUARD_NOTIFICATIONS_OCCURRENCE_MIN_INTERVAL:PT10M}
    security:
      allow-unsafe-destinations: ${PULSEGUARD_NOTIFICATIONS_ALLOW_UNSAFE:false}
      allowed-hosts: ${PULSEGUARD_NOTIFICATIONS_ALLOWED_HOSTS:}
    webhook:
      enabled: ${PULSEGUARD_NOTIFICATIONS_WEBHOOK_ENABLED:false}
      url: ${PULSEGUARD_NOTIFICATIONS_WEBHOOK_URL:}
      secret: ${PULSEGUARD_NOTIFICATIONS_WEBHOOK_SECRET:}
    slack:
      enabled: ${PULSEGUARD_NOTIFICATIONS_SLACK_ENABLED:false}
      webhook-url: ${PULSEGUARD_NOTIFICATIONS_SLACK_URL:}

