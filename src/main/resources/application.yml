server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: pulseguard

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pulseguard}
    username: ${DB_USER:pulseguard_user}
    password: ${DB_PASSWORD:pulseguard_secret_change_in_production}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.pulseguard: DEBUG
    org.hibernate.SQL: WARN

pulseguard:
  scheduler:
    enabled: ${PULSEGUARD_SCHEDULER_ENABLED:true}
    polling-interval-ms: ${PULSEGUARD_SCHEDULER_POLL_INTERVAL_MS:5000}
    initial-delay-ms: ${PULSEGUARD_SCHEDULER_INITIAL_DELAY_MS:2000}
    max-concurrent-checks: ${PULSEGUARD_MAX_CONCURRENT_CHECKS:10}
    queue-capacity: ${PULSEGUARD_SCHEDULER_QUEUE_CAPACITY:100}
    termination-timeout-seconds: ${PULSEGUARD_SCHEDULER_TERMINATION_TIMEOUT_SECONDS:30}

