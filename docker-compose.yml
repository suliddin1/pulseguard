version: '3.8'

services:
  pulseguard-postgres:
    image: postgres:16-alpine
    container_name: pulseguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pulseguard}
      POSTGRES_USER: ${DB_USER:-pulseguard_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pulseguard_secret_change_in_production}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pulseguard_user} -d ${DB_NAME:-pulseguard}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulseguard-network

volumes:
  postgres_data:
    name: pulseguard_postgres_data

networks:
  pulseguard-network:
    name: pulseguard-network
    driver: bridge
